<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疯狂方块 / Crazy Block</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(111, 143, 255, 0.18), transparent 40%),
                radial-gradient(circle at bottom, rgba(255, 176, 76, 0.14), transparent 45%),
                #10121d;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        #game-container {
            border: 1px solid rgba(176, 194, 255, 0.3);
            border-radius: 18px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
